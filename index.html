<!DOCTYPE html>
<html>

<head>

    <title>Real-Time Poll</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .option {
            margin: 20px;
        }

    </style>

</head>

<body>

    <h1>📊 Live Programming Poll</h1>

    <h2>Which programming language do you prefer?</h2>

    <div id="poll"></div>

    <script>

        const socket = io("http://localhost:5000");

        socket.on("voteUpdate", (votes) => {

            const poll = document.getElementById("poll");

            poll.innerHTML = "";

            Object.entries(votes).forEach(([language, count]) => {

                const div = document.createElement("div");

                div.className = "option";

                div.innerHTML = `
                    <button onclick="vote('${language}')">
                        ${language}
                    </button>

                    <strong>${count} votes</strong>
                `;

                poll.appendChild(div);

            });

        });

        function vote(language) {

            socket.emit("vote", language);

        }

    </script>

</body>

</html>
